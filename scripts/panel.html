<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顾问咨询台账</title>
<style>
  :root {
    --paper: #f5f7f6; --surface: #ffffff; --ink: #1b2327; --muted: #5b6971; --rule: #d3dad8; --rule-strong: #aeb9b6;
    --teal: #1f6f78; --teal-soft: #e0eeef; --amber: #a8791e; --amber-soft: #f5ecd6; --brick: #a63b2a; --brick-soft: #f6e1dd;
    --focus: #1f6f78;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Noto Serif CJK SC", "Songti SC", serif;
    --sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161a1d; --surface: #1e2427; --ink: #e5eae8; --muted: #98a4aa; --rule: #2c3538; --rule-strong: #465257;
      --teal: #62b5bd; --teal-soft: #1c3134; --amber: #d8a43f; --amber-soft: #37301c; --brick: #e2705c; --brick-soft: #3d241f;
      --focus: #62b5bd;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; font-variant-numeric: tabular-nums; padding-inline: 24px; padding-block: 24px 48px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 2rem; line-height: 1.15; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1rem; }
  a { color: var(--teal); }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--rule-strong); }
  .masthead p { margin: 0; color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .masthead button { background: none; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 8px 14px; min-height: 44px; cursor: pointer; color: var(--ink); }
  .masthead button:hover { border-color: var(--teal); color: var(--teal); }

  .summary { display: flex; flex-wrap: wrap; gap: 8px 40px; padding-block: 16px; border-bottom: 1px solid var(--rule); font-size: 0.95rem; }
  .summary .stat { display: flex; flex-direction: column; gap: 2px; }
  .summary .stat b { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
  .summary .stat span { color: var(--muted); }
  .summary .profile { border-left: 3px solid var(--teal); padding-left: 12px; }
  .summary .profile[data-fallback] { border-left-color: var(--amber); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 16px; }
  .filters label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
  .filters select, .filters input { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 8px 10px; min-height: 44px; }
  .filters input { min-width: 220px; flex: 1; }
  .filters .count { margin-left: auto; color: var(--muted); font-size: 0.9rem; }

  .ledger { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(360px, 7fr); gap: 0 32px; align-items: start; }
  @media (max-width: 880px) { .ledger { grid-template-columns: 1fr; } .detail { border-top: 1px solid var(--rule-strong); margin-top: 24px; padding-top: 16px; } }

  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
  .row { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 0; cursor: pointer; }
  .row > .bar { background: var(--teal); }
  .row[data-status="failed"] > .bar { background: var(--brick); }
  .row[data-status="fallback"] > .bar { background: var(--amber); }
  .row .body { padding: 12px 0 12px 8px; min-width: 0; }
  .row .side { padding: 12px 8px 12px 0; color: var(--muted); font-size: 0.85rem; text-align: right; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 2px; }
  .row .meta .who { color: var(--ink); }
  .row .q { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row:hover { background: color-mix(in srgb, var(--surface) 70%, var(--paper)); }
  .row[aria-current="true"] { background: var(--surface); }
  .mark { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 0.8rem; line-height: 1.6; }
  .mark.fallback { background: var(--amber-soft); color: var(--amber); }
  .mark.failed { background: var(--brick-soft); color: var(--brick); }
  .empty { padding: 32px 0; color: var(--muted); max-width: 60ch; }

  .detail { position: sticky; top: 16px; }
  .detail .head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem; }
  .detail .head .who { color: var(--ink); font-weight: 600; }
  .detail h2 { margin-bottom: 16px; max-width: 70ch; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 16px; font-size: 0.9rem; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; overflow-wrap: anywhere; }
  .detail .answer { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 16px 20px; max-width: 78ch; }
  .detail .answer pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--sans); font-size: 0.95rem; line-height: 1.6; }
  .detail .answer pre .h { display: block; font-family: var(--serif); font-size: 1.1rem; margin-top: 12px; }
  .detail .answer pre .h:first-child { margin-top: 0; }
  .detail .answer code { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 0.9em; background: var(--paper); padding: 0 4px; border-radius: 3px; }
  .detail .none { color: var(--muted); }
  .detail .reveal { animation: reveal 220ms cubic-bezier(.2,.7,.2,1); }
  @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .detail .reveal { animation: none; } }
  .error-banner { margin: 16px 0; padding: 12px 16px; border-left: 3px solid var(--brick); background: var(--brick-soft); color: var(--ink); }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1>顾问咨询台账</h1>
    <p id="path"></p>
  </div>
  <button id="refresh" type="button">刷新</button>
</header>

<section class="summary" id="summary" aria-label="汇总"></section>

<div id="error" class="error-banner" hidden></div>

<section class="filters" aria-label="筛选">
  <label>顾问 <select id="f-profile"><option value="">全部</option></select></label>
  <label>结果 <select id="f-status"><option value="">全部</option><option value="ok">已回答</option><option value="fallback">回退后回答</option><option value="failed">失败</option></select></label>
  <label>类型 <select id="f-mode"><option value="">全部</option></select></label>
  <input id="f-q" type="search" placeholder="搜索问题或回答" aria-label="搜索问题或回答">
  <span class="count" id="count"></span>
</section>

<main class="ledger">
  <ol class="rows" id="rows"></ol>
  <aside class="detail" id="detail" aria-live="polite"></aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let data = { records: [], summary: {} };
  let selected = null;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const status = r => !r.ok ? 'failed' : r.fallback_from ? 'fallback' : 'ok';
  const fmtTime = ts => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const fmtMs = ms => ms == null ? '' : ms >= 1000 ? (ms / 1000).toFixed(1) + ' 秒' : ms + ' 毫秒';

  function renderSummary(s) {
    const parts = [];
    parts.push(`<div class="stat"><b>${s.total ?? 0}</b><span>次咨询</span></div>`);
    parts.push(`<div class="stat"><b>${s.ok ?? 0}</b><span>次已回答</span></div>`);
    parts.push(`<div class="stat"><b>${s.fallbacks ?? 0}</b><span>次用了回退</span></div>`);
    for (const [name, p] of Object.entries(s.by_profile ?? {})) {
      const avg = p.calls ? Math.round(p.total_ms / p.calls) : 0;
      const models = Object.keys(p.models).join(', ');
      parts.push(`<div class="stat profile"${p.fallback_in ? ' data-fallback' : ''}><b>${esc(name)}</b><span>${p.calls} 次调用，${p.failed} 次失败，平均 ${fmtMs(avg)}${models ? '，模型 ' + esc(models) : ''}</span></div>`);
    }
    $('summary').innerHTML = parts.join('');
  }

  function fillSelect(id, values) {
    const sel = $(id); const cur = sel.value;
    sel.innerHTML = '<option value="">全部</option>' + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = values.includes(cur) ? cur : '';
  }

  function filtered() {
    const p = $('f-profile').value, st = $('f-status').value, m = $('f-mode').value, q = $('f-q').value.trim().toLowerCase();
    return data.records.filter(r =>
      (!p || r.profile === p || r.fallback_from === p) &&
      (!st || status(r) === st) &&
      (!m || r.mode === m) &&
      (!q || (r.question ?? '').toLowerCase().includes(q) || (r.answer ?? '').toLowerCase().includes(q))
    );
  }

  function renderRows() {
    const list = filtered().slice().sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
    $('count').textContent = list.length === data.records.length ? `共 ${list.length} 条` : `显示 ${list.length} / ${data.records.length} 条`;
    if (!list.length) {
      $('rows').innerHTML = `<li class="empty">${data.records.length ? '没有符合筛选条件的记录。' : '还没有咨询记录。在顾问配置里开启 <code>history.enabled</code>，重启 Claude Code，再咨询一次顾问。'}</li>`;
      return;
    }
    $('rows').innerHTML = list.map((r, i) => {
      const st = status(r);
      const who = r.fallback_from ? `${esc(r.fallback_from)} → ${esc(r.profile)}` : esc(r.profile);
      const mark = st === 'failed' ? `<span class="mark failed">${esc(r.error_code ?? 'failed')}</span>` : st === 'fallback' ? `<span class="mark fallback">回退</span>` : '';
      return `<li><button class="row" type="button" data-i="${data.records.indexOf(r)}" data-status="${st}" aria-current="${selected === r}">
        <span class="bar" aria-hidden="true"></span>
        <span class="body"><span class="meta"><span class="who">${who}</span> · ${esc(r.mode)} ${mark}</span><span class="q">${esc(r.question ?? '（未保存问题）')}</span></span>
        <span class="side">${fmtTime(r.ts)}<br>${fmtMs(r.duration_ms)}</span>
      </button></li>`;
    }).join('');
  }

  function renderAnswer(text) {
    // Minimal inline treatment of the advisor's Markdown (headings, bold, inline code); not a full renderer.
    const inline = l => l.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const lines = esc(text).replace(/\r/g, '').split('\n');
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^#{1,6}\s/.test(l)) { out.push(`<span class="h">${inline(l.replace(/^#{1,6}\s/, ''))}</span>`); if (lines[i + 1] === '') i++; }
      else out.push(inline(l));
    }
    return out.join('\n');
  }

  function renderDetail() {
    const r = selected;
    if (!r) { $('detail').innerHTML = `<p class="none">选择一条咨询查看详情。</p>`; return; }
    const st = status(r);
    const rows = [
      ['时间', new Date(r.ts).toLocaleString('zh-CN')],
      ['顾问', r.fallback_from ? `${r.fallback_from} → ${r.profile}（回退，原因 ${r.fallback_reason}）` : r.profile],
      ['模型', r.requested_model],
      ['类型', r.mode],
      ['耗时', fmtMs(r.duration_ms)],
      ['结果', st === 'failed' ? `失败：${r.error_code}` : '已回答'],
      ['证据', (r.context_labels ?? []).length ? r.context_labels.join('；') : '未提供'],
      ['约束', String(r.constraints ?? 0) + ' 条'],
      ['请求 ID', r.request_id ?? '—'],
    ];
    $('detail').innerHTML = `<div class="reveal">
      <div class="head"><span class="who">${esc(r.profile)}</span><span>${esc(fmtTime(r.ts))}</span></div>
      <h2>${esc(r.question ?? '（未保存问题）')}</h2>
      <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <h3>顾问回答</h3>
      <div class="answer">${r.answer ? `<pre>${renderAnswer(r.answer)}</pre>` : `<p class="none">${st === 'failed' ? '没有回答：本次咨询失败。' : `未保存回答（${r.answer_bytes ?? 0} 字节）。`}</p>`}</div>
    </div>`;
  }

  async function load() {
    $('error').hidden = true;
    try {
      const res = await fetch('/api/ledger');
      if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
      data = await res.json();
      $('path').textContent = data.history_path;
      renderSummary(data.summary);
      fillSelect('f-profile', [...new Set(data.records.flatMap(r => [r.profile, r.fallback_from]).filter(Boolean))]);
      fillSelect('f-mode', [...new Set(data.records.map(r => r.mode).filter(Boolean))]);
      if (selected) selected = data.records.find(r => r.ts === selected.ts && r.request_id === selected.request_id) ?? null;
      if (!selected && data.records.length) selected = data.records.at(-1);
      renderRows(); renderDetail();
    } catch (e) {
      $('error').textContent = `台账加载失败：${e.message}`; $('error').hidden = false;
    }
  }

  $('rows').addEventListener('click', e => {
    const btn = e.target.closest('.row'); if (!btn) return;
    selected = data.records[Number(btn.dataset.i)]; renderRows(); renderDetail();
  });
  for (const id of ['f-profile', 'f-status', 'f-mode']) $(id).addEventListener('change', renderRows);
  $('f-q').addEventListener('input', renderRows);
  $('refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
