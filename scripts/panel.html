<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顾问咨询台账</title>
<style>
  :root {
    --bg: #f7f8f7; --ink: #1d2426; --ink-2: #57646a; --muted: #8a959a; --line: #dde3e1; --line-2: #c3ccc9;
    --accent: #1d6a72; --accent-bg: #e8f0f1; --bad: #9c3a2b;
    --sans: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171c1e; --ink: #e4e9e7; --ink-2: #aab5b9; --muted: #74818a; --line: #293134; --line-2: #3c474b;
      --accent: #74c0c7; --accent-bg: #1b3034; --bad: #e07a68;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 15px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; font-variant-numeric: tabular-nums; padding-inline: 24px; padding-block: 40px 64px; }
  .wrap { max-width: 1160px; margin: 0 auto; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: 0; }
  h1 { font-size: 1.25rem; line-height: 1.3; }
  h2 { font-size: 1.3rem; line-height: 1.45; }
  h3 { font-size: 1rem; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 32px; padding-bottom: 20px; border-bottom: 1px solid var(--ink); }
  .top .brief { color: var(--ink-2); font-size: 0.95rem; }
  .top .brief button { background: none; border: 0; padding: 0; margin: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; min-height: 44px; }
  .top .brief button:hover, .top .brief button[aria-pressed="true"] { text-decoration-color: currentColor; }
  .top .brief button[aria-pressed="true"] { font-weight: 600; }
  .top .brief .bad { color: var(--bad); }
  .top .refresh { margin-left: auto; background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--muted); cursor: pointer; }
  .top .refresh:hover { color: var(--accent); }

  .tools { display: flex; flex-wrap: wrap; gap: 0 32px; padding: 8px 0 24px; border-bottom: 1px solid var(--line); }
  .tools input, .tools select { min-height: 44px; border: 0; border-bottom: 1px solid var(--line-2); border-radius: 0; background: transparent; padding: 0; }
  .tools input { flex: 1 1 280px; }
  .tools input::placeholder { color: var(--muted); }
  .tools select { flex: 0 1 auto; max-width: 100%; color: var(--ink-2); padding-right: 4px; }
  .tools input:focus, .tools select:focus { border-bottom-color: var(--accent); outline: none; }

  .ledger { display: grid; grid-template-columns: minmax(300px, 5fr) minmax(360px, 7fr); min-width: 0; }
  .ledger > * { min-width: 0; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 20px 14px 0; cursor: pointer; }
  .row .when { color: var(--muted); font-size: 0.85rem; line-height: 1.5; padding-top: 2px; }
  .row .when b { display: block; font-weight: 400; color: var(--ink-2); }
  .row .q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .m { display: flex; flex-wrap: wrap; gap: 0 12px; color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .row .m .who { color: var(--accent); }
  .row .m .bad { color: var(--bad); }
  .row:hover .q { color: var(--accent); }
  .row[aria-current="true"] { box-shadow: inset 3px 0 0 var(--accent); padding-left: 16px; }
  .row[aria-current="true"] .q { color: var(--ink); font-weight: 600; }
  .empty { padding: 40px 0; color: var(--muted); max-width: 42ch; line-height: 1.8; }

  .detail { position: sticky; top: 24px; padding: 28px 0 0 40px; border-left: 1px solid var(--line); min-height: 60vh; }
  .detail .none { color: var(--muted); margin: 0; }
  .detail h2 { max-width: 56ch; margin-bottom: 12px; }
  .detail .line { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 0.9rem; margin-bottom: 6px; }
  .detail .line .who { color: var(--accent); font-weight: 600; }
  .detail .line .bad { color: var(--bad); }
  .detail .evidence { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; max-width: 70ch; }
  .detail .evidence span { color: var(--ink-2); }
  .answer { max-width: 70ch; line-height: 1.75; }
  .answer h3 { margin: 26px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .answer h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .answer p { margin: 0 0 10px; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 1.4em; }
  .answer li { margin: 3px 0; }
  .answer code { font-family: var(--mono); font-size: 0.86em; background: var(--accent-bg); color: var(--accent); padding: 1px 5px; border-radius: 3px; }
  .answer pre { margin: 0 0 14px; padding: 12px 16px; background: var(--accent-bg); border-radius: 3px; overflow-x: auto; font-family: var(--mono); font-size: 0.86em; line-height: 1.55; }
  .answer pre code { background: none; color: inherit; padding: 0; }
  .detail .foot { margin-top: 32px; color: var(--muted); font-size: 0.8rem; font-family: var(--mono); overflow-wrap: anywhere; }
  .banner { margin: 16px 0; color: var(--bad); }
  .path { margin: 48px 0 0; color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }

  @media (max-width: 900px) {
    body { padding-block: 24px 48px; }
    .ledger { grid-template-columns: 1fr; }
    .detail { position: static; padding: 24px 0 0; border-left: 0; border-top: 1px solid var(--ink); margin-top: 24px; min-height: 0; }
    .row { grid-template-columns: 1fr; padding-right: 0; }
    .row .when { display: flex; gap: 8px; }
    .row .when b { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>顾问咨询台账</h1>
    <p class="brief" id="brief"></p>
    <button class="refresh" id="refresh" type="button">刷新</button>
  </header>

  <p id="banner" class="banner" hidden></p>

  <div class="tools">
    <input id="f-q" type="search" placeholder="搜索问题或回答" aria-label="搜索问题或回答">
    <select id="f-status" aria-label="结果"><option value="">全部结果</option><option value="ok">已回答</option><option value="fallback">回退后回答</option><option value="failed">失败</option></select>
    <select id="f-mode" aria-label="类型"><option value="">全部类型</option></select>
  </div>

  <main class="ledger">
    <ol class="rows" id="rows"></ol>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </main>

  <p class="path" id="path"></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let data = { records: [], summary: {} };
  let selected = null;
  let profileFilter = '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const status = r => !r.ok ? 'failed' : r.fallback_from ? 'fallback' : 'ok';
  const byTime = (a, b) => String(b.ts).localeCompare(String(a.ts));
  const pad = n => String(n).padStart(2, '0');
  const fmtDay = ts => { const d = new Date(ts); return isNaN(d) ? '' : `${d.getMonth() + 1}月${d.getDate()}日`; };
  const fmtClock = ts => { const d = new Date(ts); return isNaN(d) ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmtMs = ms => ms == null ? '' : ms >= 1000 ? `${(ms / 1000).toFixed(ms >= 10000 ? 0 : 1)} 秒` : `${ms} 毫秒`;
  const modeName = m => ({ architecture: '架构', review: '评审', debug: '调试', security: '安全', planning: '规划', general: '一般' }[m] ?? m);

  function renderBrief(s) {
    const entries = Object.entries(s.by_profile ?? {});
    if (!entries.length) { $('brief').innerHTML = ''; return; }
    const parts = entries.map(([name, p]) => `<button type="button" data-p="${esc(name)}" aria-pressed="${profileFilter === name}">${esc(name)}</button> ${p.calls} 次`);
    const extras = [];
    if (s.fallbacks) extras.push(`${s.fallbacks} 次回退`);
    const failed = s.total - s.ok; if (failed) extras.push(`<span class="bad">${failed} 次失败</span>`);
    $('brief').innerHTML = `共 ${s.total} 次咨询，${parts.join('，')}${extras.length ? '；' + extras.join('，') : ''}`;
  }

  function fillModes() {
    const sel = $('f-mode'); const cur = sel.value;
    const modes = [...new Set(data.records.map(r => r.mode).filter(Boolean))];
    sel.innerHTML = '<option value="">全部类型</option>' + modes.map(m => `<option value="${esc(m)}">${esc(modeName(m))}</option>`).join('');
    sel.value = modes.includes(cur) ? cur : '';
  }

  function filtered() {
    const st = $('f-status').value, m = $('f-mode').value, q = $('f-q').value.trim().toLowerCase();
    return data.records.filter(r =>
      (!profileFilter || r.profile === profileFilter || r.fallback_from === profileFilter) &&
      (!st || status(r) === st) && (!m || r.mode === m) &&
      (!q || (r.question ?? '').toLowerCase().includes(q) || (r.answer ?? '').toLowerCase().includes(q)));
  }

  function renderRows() {
    const list = filtered().sort(byTime);
    if (!list.length) {
      $('rows').innerHTML = `<li class="empty">${data.records.length ? '没有符合条件的记录。' : '还没有咨询记录。在顾问配置里开启 history.enabled，重启 Claude Code，咨询一次顾问后回来刷新。'}</li>`;
      return;
    }
    $('rows').innerHTML = list.map(r => {
      const st = status(r);
      const who = r.fallback_from ? `${esc(r.fallback_from)} → ${esc(r.profile)}` : esc(r.profile);
      const state = st === 'failed' ? `<span class="bad">失败 ${esc(r.error_code ?? '')}</span>` : st === 'fallback' ? `<span>回退</span>` : '';
      return `<li><button class="row" type="button" data-i="${data.records.indexOf(r)}" aria-current="${selected === r}">
        <span class="when"><b>${fmtDay(r.ts)}</b>${fmtClock(r.ts)}</span>
        <span><span class="q">${esc(r.question ?? '（未保存问题）')}</span>
        <span class="m"><span class="who">${who}</span><span>${esc(modeName(r.mode))}</span><span>${fmtMs(r.duration_ms)}</span>${state}</span></span>
      </button></li>`;
    }).join('');
  }

  // Small Markdown subset: headings, paragraphs, lists, fenced code, inline code, bold.
  function renderAnswer(text) {
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const lines = String(text).replace(/\r/g, '').split('\n');
    const out = []; let para = []; let list = null; let code = null;
    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
    const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null; } };
    for (const l of lines) {
      if (code !== null) { if (/^```/.test(l)) { out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code = null; } else code.push(l); continue; }
      if (/^```/.test(l)) { flushPara(); flushList(); code = []; continue; }
      const h = l.match(/^#{1,6}\s+(.*)/); const ul = l.match(/^\s*[-*]\s+(.*)/); const ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (h) { flushPara(); flushList(); out.push(`<h3>${inline(h[1])}</h3>`); }
      else if (ul || ol) { flushPara(); const tag = ul ? 'ul' : 'ol'; if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; } list.items.push((ul || ol)[1]); }
      else if (!l.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(l); }
    }
    flushPara(); flushList();
    if (code) out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    return out.join('');
  }

  function renderDetail() {
    const r = selected;
    if (!r) { $('detail').innerHTML = `<p class="none">选一条咨询查看详情。</p>`; return; }
    const st = status(r);
    const who = r.fallback_from
      ? `<span class="who">${esc(r.fallback_from)} → ${esc(r.profile)}</span><span>回退，原因 ${esc(r.fallback_reason)}</span>`
      : `<span class="who">${esc(r.profile)}</span>`;
    const outcome = st === 'failed' ? `<span class="bad">失败 ${esc(r.error_code)}</span>` : '';
    const labels = r.context_labels ?? [];
    const evidence = `证据 ${labels.length ? labels.map(l => `<span>${esc(l)}</span>`).join('，') : '无'}${r.constraints ? `，约束 ${r.constraints} 条` : ''}`;
    const answer = r.answer ? `<div class="answer">${renderAnswer(r.answer)}</div>`
      : `<p class="none">${st === 'failed' ? '本次咨询失败，没有回答。' : `回答未保存（${r.answer_bytes ?? 0} 字节）。`}</p>`;
    const d = new Date(r.ts);
    $('detail').innerHTML = `
      <h2>${esc(r.question ?? '（未保存问题）')}</h2>
      <div class="line">${who}<span>${esc(r.requested_model ?? '')}</span><span>${esc(modeName(r.mode))}</span><span>${fmtMs(r.duration_ms)}</span><span>${isNaN(d) ? '' : `${d.getFullYear()}年${fmtDay(r.ts)} ${fmtClock(r.ts)}`}</span>${outcome}</div>
      <p class="evidence">${evidence}</p>
      ${answer}
      ${r.request_id ? `<p class="foot">${esc(r.request_id)}</p>` : ''}`;
  }

  async function load() {
    $('banner').hidden = true;
    try {
      const res = await fetch('/api/ledger');
      if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
      data = await res.json();
      $('path').textContent = `台账文件 ${data.history_path}`;
      renderBrief(data.summary); fillModes();
      if (selected) selected = data.records.find(r => r.ts === selected.ts && r.request_id === selected.request_id) ?? null;
      if (!selected && data.records.length) selected = data.records.slice().sort(byTime)[0];
      renderRows(); renderDetail();
    } catch (e) { $('banner').textContent = `台账加载失败：${e.message}`; $('banner').hidden = false; }
  }

  $('rows').addEventListener('click', e => {
    const btn = e.target.closest('.row'); if (!btn) return;
    selected = data.records[Number(btn.dataset.i)]; renderRows(); renderDetail();
  });
  $('brief').addEventListener('click', e => {
    const b = e.target.closest('button[data-p]'); if (!b) return;
    profileFilter = profileFilter === b.dataset.p ? '' : b.dataset.p;
    renderBrief(data.summary); renderRows();
  });
  for (const id of ['f-status', 'f-mode']) $(id).addEventListener('change', renderRows);
  $('f-q').addEventListener('input', renderRows);
  $('refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
